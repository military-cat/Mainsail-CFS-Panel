<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFSail · Demo</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  body { margin: 0; background: #111315; color: #e7e9ec; }
  header, main { width: min(680px, calc(100% - 32px)); margin: 24px auto; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  h1 { font-size: 24px; margin: 0; flex: 1; }
  label { font-size: 13px; color: #bac2cd; }
  select { font: inherit; padding: 7px 10px; background: #25292e; color: inherit; border: 1px solid #525b65; border-radius: 6px; }
  p { flex-basis: 100%; margin: 0; color: #aeb8c4; font-size: 13px; line-height: 1.6; }
</style>
<header>
  <h1>CFSail</h1>
  <label for="demo-language" id="language-label">Language</label>
  <select id="demo-language">
    <option value="en">English</option>
    <option value="ko">한국어</option>
    <option value="ja">日本語</option>
    <option value="zh">简体中文</option>
    <option value="es">Español</option>
  </select>
  <p id="demo-note"></p>
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%">
    <label for="demo-error-code">오류 종류 / Error</label>
    <select id="demo-error-code">
      <option value="2865">2865 · 익스트루더 이탈 실패</option>
      <option value="2836">2836 · 허브 → 익스트루더 센서</option>
      <option value="2837">2837 · 센서 → 압출 기어</option>
      <option value="2839">2839 · 필라멘트 소진</option>
      <option value="2841">2841 · 커터 걸림</option>
      <option value="2853">2853 · 온습도 센서</option>
      <option value="2999">2999 · 미등록 코드 / Unknown</option>
    </select>
    <label for="demo-recovery-mode">Recovery test</label>
    <select id="demo-recovery-mode">
      <option value="success">복구 성공 / Success</option>
      <option value="reject">명령 거절 / Rejected</option>
      <option value="disconnect">연결 끊김 / Disconnected</option>
      <option value="unconfirmed">완료 보고 없음 / No confirmation</option>
      <option value="printing">출력 중 / Printing</option>
    </select>
    <button id="demo-create-error" type="button">CFS 오류 만들기</button>
    <button id="demo-reset" type="button">데모 초기화</button>
    <span id="demo-recovery-result" role="status" style="font-size:12px"></span>
  </div>
</header>
<main><div data-cfsail-mount></div></main>
<script>
  const demoCopy = {
    en: ['Language', 'This is a simulated printer. Changes stay in this demo.'],
    ko: ['언어', '모의 프린터 화면입니다. 변경 사항은 이 데모에만 적용됩니다.'],
    ja: ['言語', 'プリンターのデモ画面です。変更はこのデモ内にのみ反映されます。'],
    zh: ['语言', '这是模拟打印机界面。更改仅在此演示中生效。'],
    es: ['Idioma', 'Esta es una impresora simulada. Los cambios solo se aplican a esta demostración.']
  };
  const selected = new URLSearchParams(location.search).get('lang');
  const demoLanguage = Object.hasOwn(demoCopy, selected) ? selected : 'en';
  document.documentElement.lang = demoLanguage;
  document.getElementById('language-label').textContent = demoCopy[demoLanguage][0];
  document.getElementById('demo-note').textContent = demoCopy[demoLanguage][1];
  const chooser = document.getElementById('demo-language');
  chooser.value = demoLanguage;
  chooser.onchange = () => { location.search = '?lang=' + chooser.value; };
  const result = document.getElementById('demo-recovery-result');
  document.getElementById('demo-create-error').onclick = async () => {
    const response = await fetch('/__demo/recovery', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: document.getElementById('demo-recovery-mode').value, code: Number(document.getElementById('demo-error-code').value) }) });
    result.textContent = response.ok ? '모의 오류 ' + document.getElementById('demo-error-code').value + ' 발생 · 실제 프린터에는 연결하지 않습니다.' : 'Simulation failed';
  };
  document.getElementById('demo-reset').onclick = async () => {
    const response = await fetch('/__demo/reset', { method: 'POST' });
    if (response.ok) location.reload();
  };
  const panelScript = document.createElement('script');
  panelScript.src = '/assets/cfs-panel.js';
  panelScript.dataset.lang = demoLanguage;
  panelScript.dataset.wsUrl = 'ws://' + location.host + '/mock-cfs';
  document.body.append(panelScript);
</script>
</html>
